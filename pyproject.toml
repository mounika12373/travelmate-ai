[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travelmate-ai"
version = "1.0.0"
description = "A Streamlit-based smart travel companion application querying SQLite."
readme = "README.md"
authors = [
    { name = "TravelMate Contributors" }
]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Streamlit"
]
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "plotly>=5.15.0",
    "google-adk"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-spec>=6.1.0",
    "pytest-describe>=3.1.0"
]
dev = [
    "ruff>=0.1.0"
]

[tool.pytest.ini_options]
addopts = "--spec"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools]
packages = []

[tool.vulture]
exclude = [".venv", "gitlab-runner"]
ignore_decorators = []
ignore_names = []
make_whitelist = false
min_confidence = 80
paths = ["app.py", "pages", "utils", "tests"]
sort_by_size = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
targets = ["."]

